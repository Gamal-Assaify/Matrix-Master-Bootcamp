<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title> Google Search</title>
        <link rel="stylesheet" href="GoogleSearch.css">
    </head>
    <body>
        <header>
            <img src="D:\HTML Learning\GoogleBETA.png" alt="GoogleLogo">
        </header>
        <div class="search-box">
            <p>Search the web using Google!</p>
            <form>
                <input type="text" placeholder="Search in Google" class="search-input"><br>
                <button type="submit">GoogleSearch</button>
                <button type="submit">I'm Feeling Lucky</button>
            </form>
        </div>

        <div class="columns-container">
            <div class="column col-left">
                <p class="col-title">Special Searches</p>
                <a href="#">Stanford Search</a><br>
                <a href="#">Linux Search</a>
            </div>
            <div class="column col-middle">
                <a href="#">Help!</a><br>
                <a href="#">About Google!</a><br>
                <a href="#">Company INFO</a><br>
                <a href="#">Google Logos</a>
            </div>
            <div class="column col-right">
                <p>Get Google!</p>
                <p>updates monthly:</p>
                <form>
                    <input type="email" placeholder="your e-mail">
                    <br>
                    <button type="submit">Subscribe</button>
                    <a href="#" class="archive-link">Archive</a>
                </form>
            </div>
        </div>

        <footer>
             <p>Copyright &copy;1998 Google Inc.</p>
        </footer>
    </body>
 </html>
