<!DOCTYPE html>
<html lang="en">
<head> 
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in to Twitter</title>
    <link rel="stylesheet" href="TwitterThread.css">
</head>
<body>

    <div class="login-card">
        <!-- Close button & Twitter logo header -->
        <header class="card-header">
            <span class="close-btn">&times;</span>
            <img src="D:\HTML Learning\Twitter Thread\twitter.png" alt="Twitter Logo" class="twitter-logo">
        </header>

        <h1>Sign in to Twitter</h1>

        <!-- OAuth Social Buttons -->
        <button type="button" class="btn btn-outline">
            <img src="D:\HTML Learning\Twitter Thread\google.png" alt="Google Logo" class="btn-icon">
            Sign in with Google
        </button>

        <button type="button" class="btn btn-outline btn-apple">
            <img src="D:\HTML Learning\Twitter Thread\appel.png" alt="Apple Logo" class="btn-icon">
            Sign in with Apple
        </button>

        <!-- Separator -->
        <div class="divider">
            <span>or</span>
        </div>

        <!-- Login Form -->
        <form class="login-form">
            <input type="text" placeholder="Phone, email, or username" class="form-input">
            <button type="submit" class="btn btn-black">Next</button>
            <button type="button" class="btn btn-outline btn-forgot">Forgot password?</button>
        </form>

        <!-- Footer Signup Link -->
        <footer class="card-footer">
            <p>Don't have an account? <a href="#">Sign up</a></p>
        </footer>
    </div>

</body>
</html>
